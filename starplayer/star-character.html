<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>星星小人</title>
<style>
  html,body{height:100%;margin:0;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 40%,#fffaf0,#f2ede4);font-family:system-ui,sans-serif}
  .stage{width:min(90vw,720px);cursor:pointer;-webkit-tap-highlight-color:transparent}
  svg{width:100%;height:auto;overflow:visible;display:block}

  /* ---------- 整体悬浮呼吸 ---------- */
  #character{animation:float 3.4s ease-in-out infinite;transform-box:view-box;transform-origin:210px 180px}
  @keyframes float{
    0%,100%{transform:translateY(0) scale(1)}
    50%    {transform:translateY(-14px) scale(1.012)}
  }
  .stage:hover #character,.stage.on #character{animation:float-fast 1.1s ease-in-out infinite}
  @keyframes float-fast{
    0%,100%{transform:translateY(-2px)}
    50%    {transform:translateY(-10px)}
  }

  /* ---------- 星星棒挥动 ---------- */
  #wand{transform-box:view-box;transform-origin:374px 169px;
        animation:idle-sway 4.2s ease-in-out infinite}
  @keyframes idle-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .stage:hover #wand,.stage.on #wand{animation:wave 1.03s ease-in-out infinite}
  @keyframes wave{
    0%  {transform:rotate(-26deg)}
    50% {transform:rotate(24deg)}
    100%{transform:rotate(-26deg)}
  }

  /* 头部随挥动轻微反向摆 */
  .stage:hover #body-group,.stage.on #body-group{animation:tilt 2.06s ease-in-out infinite}
  #body-group{transform-box:view-box;transform-origin:200px 250px}
  @keyframes tilt{0%,100%{transform:rotate(1.4deg)}50%{transform:rotate(-1.4deg)}}

  /* ---------- 眨眼（悬停时 3 秒一次） ---------- */
  .eye{transform-box:view-box;transform-origin:var(--ex) var(--ey)}
  .stage:hover .eye,.stage.on .eye{animation:blink 3s ease-in-out infinite}
  @keyframes blink{
    0%,88%,100%{transform:scaleY(1)}
    92%        {transform:scaleY(.08)}
    96%        {transform:scaleY(1)}
  }

  /* ---------- 唱歌：嘴巴放大缩小 ---------- */
  #mouth{transform-box:view-box;transform-origin:206px 191px}
  .stage:hover #mouth,.stage.on #mouth{animation:sing 2.5s ease-in-out infinite}
  @keyframes sing{
    0%   {transform:scale(1,1)}
    18%  {transform:scale(1.5,2.05)}
    36%  {transform:scale(1.1,1.15)}
    58%  {transform:scale(1.75,2.6)}
    78%  {transform:scale(1.2,1.35)}
    100% {transform:scale(1,1)}
  }

  /* ---------- 环绕小星星 ---------- */
  #sparkles{opacity:0;transition:opacity .35s ease}
  .stage:hover #sparkles,.stage.on #sparkles{opacity:1}
  .orbit{transform-box:view-box;transform-origin:463px 50px;
         animation:spin var(--dur,4s) linear infinite;animation-delay:var(--d)}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .twinkle{animation:tw 1.3s ease-in-out infinite;animation-delay:var(--d)}
  @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .hint{margin-top:8px;text-align:center;color:#b8ab97;font-size:13px;letter-spacing:.08em}
</style>
</head>
<body>
<div class="stage" id="stage">
<svg viewBox="-40 -60 620 400" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- 身体：水一样不规则流动的边缘 -->
  <filter id="liquid" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="3" seed="3" result="noise">
      <animate attributeName="baseFrequency" dur="10s" repeatCount="indefinite"
               values="0.009 0.013;0.018 0.007;0.006 0.017;0.009 0.013"/>
      <animate attributeName="seed" dur="13.3s" repeatCount="indefinite" values="3;9;3"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" xChannelSelector="R" yChannelSelector="G" result="disp">
      <animate attributeName="scale" dur="6.7s" repeatCount="indefinite" values="25;60;38;25"/>
    </feDisplacementMap>
    <feGaussianBlur in="disp" stdDeviation="7.5"/>
  </filter>

  <filter id="softblur" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>

  <filter id="wandtex" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.25 0.25" numOctaves="3" seed="8982"/>
    <feDisplacementMap in="b" scale="8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>

  <filter id="facetex" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.25 0.25" numOctaves="3" seed="6601"/>
    <feDisplacementMap in="SourceGraphic" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="0.5"/>
  </filter>

  <filter id="mouthtex" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.25 0.25" numOctaves="3" seed="7318"/>
    <feDisplacementMap in="SourceGraphic" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>

  <!-- 小星星（缩小版原始星形） -->
  <g id="ministar">
    <path transform="translate(-28,-25) scale(0.48)"
      d="M85.887 9.196C90.921 16.751 78.446 42.886 78.446 42.886C73.778 42.722 97.410 47.726 106.708 55.553C116.007 63.379 74.620 64.267 74.620 64.267C74.620 64.267 77.864 97.327 71.994 95.365C66.125 93.404 49.367 66.934 49.367 66.934C49.367 66.934 13.541 74.263 8.507 71.250C3.473 68.237 37.585 47.202 37.585 47.202C37.585 47.202 12.939 18.766 18.522 15.273C24.105 11.781 55.557 32.339 55.557 32.339C55.557 32.339 80.854 1.641 85.887 9.196Z"/>
  </g>
</defs>

<g id="character">

  <!-- 身体 + 五官 -->
  <g id="body-group">
    <path filter="url(#liquid)" fill="#FFC96B"
      d="M192.086 268.833C235.973 311.21 321.9 221.071 394.895 196.402C467.889 171.733 282.923 15 192.086 15C101.249 15 -27.691 139.383 28.856 196.402C85.403 253.42 148.199 226.457 192.086 268.833Z"/>

    <g class="eye" style="--ex:155.5px;--ey:109px" filter="url(#facetex)">
      <ellipse cx="9.839" cy="5.784" rx="9.839" ry="5.784"
        transform="matrix(0.028591 -0.999591 -0.999591 -0.028591 161 119)" fill="#1E1E1E"/>
    </g>
    <g class="eye" style="--ex:269.6px;--ey:109.8px" filter="url(#facetex)">
      <ellipse cx="9.011" cy="5.611" rx="9.011" ry="5.611"
        transform="matrix(0.028591 -0.999591 -0.999591 -0.028591 275 119)" fill="#1E1E1E"/>
    </g>
    <g id="mouth" filter="url(#mouthtex)">
      <ellipse cx="206.295" cy="191.059" rx="16.128" ry="12.848"
        transform="rotate(0.754935 206.295 191.059)" fill="#FFEBDA" fill-opacity="0.82"/>
    </g>
  </g>

  <!-- 星星棒（以手部 374,169 为轴心挥动） -->
  <g id="wand">
    <line x1="374.207" y1="168.891" x2="451.207" y2="66.891"
          stroke="#A4A4A4" stroke-width="7" filter="url(#wandtex)"/>
    <path filter="url(#softblur)" fill="#5DDAEE"
      d="M487.198 9.806C492.232 17.361 479.757 43.496 479.757 43.496C475.089 43.331 498.721 48.335 508.019 56.162C517.318 63.989 475.931 64.877 475.931 64.877C475.931 64.877 479.175 97.936 473.305 95.975C467.436 94.014 450.678 67.544 450.678 67.544C450.678 67.544 414.852 74.872 409.818 71.859C404.784 68.846 438.896 47.811 438.896 47.811C438.896 47.811 414.25 19.375 419.833 15.883C425.416 12.390 456.868 32.949 456.868 32.949C456.868 32.949 482.165 2.251 487.198 9.806Z"/>

  </g>

  <!-- 环绕小星星：以星星 (463,50) 为圆心自转，不跟随星星棒摆动；层级最上 -->
  <g id="sparkles" filter="url(#softblur)"></g>

</g>
</svg>
<div class="hint">悬停 / 点触 角色</div>
</div>

<script>
  // 触屏设备用点击切换
  const stage = document.getElementById('stage');
  // 生成 25 颗环绕小星星
  const CX=463, CY=50, N=25, box=document.getElementById('sparkles');
  const SVGNS='http://www.w3.org/2000/svg';
  for(let i=0;i<N;i++){
    const ang=(i/N)*Math.PI*2 + (i%3)*0.21;          // 起始角错开
    const r  =62 + ((i*37)%5)*22;                     // 半径 62~150 分层
    const sc =0.13 + ((i*53)%7)*0.032;                // 大小错开
    const dur=3.4 + ((i*29)%6)*0.9;                   // 公转速度错开
    const orbit=document.createElementNS(SVGNS,'g');
    orbit.setAttribute('class','orbit');
    orbit.style.setProperty('--d', (-(i*dur/N)).toFixed(2)+'s');
    orbit.style.setProperty('--dur', dur.toFixed(2)+'s');
    const tw=document.createElementNS(SVGNS,'g');
    tw.setAttribute('class','twinkle');
    tw.style.setProperty('--d', (-(i*0.17)%1.3).toFixed(2)+'s');
    const use=document.createElementNS(SVGNS,'use');
    use.setAttribute('href','#ministar');
    use.setAttribute('fill', i%2 ? '#5DDAEE' : '#FFC96B');
    use.setAttribute('transform',
      `translate(${(CX+Math.cos(ang)*r).toFixed(1)},${(CY+Math.sin(ang)*r).toFixed(1)}) scale(${sc.toFixed(3)})`);
    tw.appendChild(use); orbit.appendChild(tw); box.appendChild(orbit);
  }

  stage.addEventListener('touchstart', e => { e.preventDefault(); stage.classList.toggle('on'); }, {passive:false});
</script>
</body>
</html>
